<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jds — Valorant Locker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ff4655">
<style>
:root{--v-red:#ff4655;--v-dark:#0b0e10;--v-text:#e6e8ea;--v-mute:#9aa3ab;--card:rgba(13,17,20,.75);--glass:rgba(13,17,20,.65);--border:rgba(255,255,255,.08);}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--v-dark);color:var(--v-text);font-family:'Rajdhani',system-ui,sans-serif;line-height:1.4;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg .grid{position:absolute;inset:-200px;background:radial-gradient(ellipse at top left, rgba(255,70,85,.06), transparent 35%),radial-gradient(ellipse at bottom right, rgba(0,150,255,.06), transparent 35%),linear-gradient(transparent 98%, rgba(255,255,255,.06) 100%),linear-gradient(90deg, transparent 98%, rgba(255,255,255,.06) 100%);background-size:100% 100%,100% 100%,60px 60px,60px 60px;animation:pan 40s linear infinite;filter:saturate(1.1)}
@keyframes pan{from{transform:translate3d(0,0,0)}to{transform:translate3d(-200px,-200px,0)}}
.shard{position:absolute;width:50vmax;height:50vmax;transform:skewY(-12deg) rotate(15deg);background:radial-gradient(circle at 30% 30%, rgba(255,70,85,.14), transparent 60%);filter:blur(22px);mix-blend-mode:screen;animation:float 16s ease-in-out infinite;opacity:var(--shardOpacity,1)}
.s1{top:-10vmax;left:-20vmax}.s2{bottom:-20vmax;right:-30vmax;animation-duration:20s}.s3{top:20vmax;right:-25vmax;animation-duration:24s}
@keyframes float{50%{transform: translateY(-20px) skewY(-12deg) rotate(15deg)}}
canvas.particles{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:var(--particlesOpacity,0)}
.site-header{position:sticky;top:0;z-index:10;backdrop-filter: blur(8px);background:linear-gradient(to bottom, rgba(0,0,0,.45), transparent);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Teko',sans-serif;font-size:26px;letter-spacing:.5px}
.logo{width:22px}.cc{color:var(--v-red)}.path{color:var(--v-mute);font-size:.85em;margin-left:6px}
nav a{color:var(--v-mute);text-decoration:none;margin:0 10px;position:relative}
nav a::after{content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--v-red);transition:width .25s}
nav a:hover{color:var(--v-text)}nav a:hover::after{width:100%}
.controls{display:flex;align-items:center;gap:10px}
.toggle{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--v-text);padding:8px 10px;border-radius:10px;font-size:14px;cursor:pointer}
.toggle.active{outline:1px solid var(--v-red)}
.panel{max-width:1200px;margin:32px auto;padding:20px;border:1px solid var(--border);background:var(--glass);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-family:'Teko',sans-serif;font-size:34px;letter-spacing:.5px;margin:0 0 12px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.hero h1{font-family:'Teko',sans-serif;font-size:60px;margin:0;line-height:1}
.subtitle{color:var(--v-mute);margin:.25rem 0 1rem;display:flex;align-items:center;gap:10px}
.rank-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.04)}
.rank-badge img{width:22px;height:22px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}
.stat .label{display:block;color:var(--v-mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.stat .value{font-family:'Teko',sans-serif;font-size:26px}
.card-frame{position:relative;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01))}
.card-frame img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;filter:contrast(1.05) saturate(1.02)}
.card-caption{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;font-weight:600;background:linear-gradient(180deg, transparent, rgba(0,0,0,.55))}

/* Grouped Skins */
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.group-card{border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden}
.group-head{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}
.group-head h3{margin:0;font-family:'Teko',sans-serif;font-size:28px}
.group-count{font-size:12px;color:var(--v-mute);padding:4px 8px;border:1px solid var(--border);border-radius:999px}
.skin-list{margin:0;padding:10px 12px;list-style:none}
.skin-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.skin-item:hover{background:rgba(255,255,255,.04)}
.skin-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}

.flex-grid,.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover;display:block}
.card .body{padding:12px}
.card h4{margin:0 0 6px;font-family:'Teko',sans-serif;font-size:24px}
.badge{font-size:12px;color:var(--v-mute);padding:4px 8px;border:1px solid var(--border);border-radius:999px}
.bp-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:12px;color:var(--v-mute)}
.bp-dot{width:8px;height:8px;border-radius:50%;background:var(--v-red);display:inline-block}
.section-help{color:var(--v-mute); margin-top:8px}
</style>
</head>
<body>
<div class="bg" id="bg-shards">
  <div class="grid"></div>
  <div class="shard s1"></div>
  <div class="shard s2"></div>
  <div class="shard s3"></div>
</div>
<canvas class="particles" id="bg-particles"></canvas>

<header class="site-header">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff4655" d="M3 17V4l6 8 6-8v13l-6-8z"/></svg>
    <span class="brand-text">7udas<span class="cc">.cc</span><span class="path">/jds1337</span></span>
  </div>
  <nav><a href="#overview">Overview</a><a href="#skins">Skins</a><a href="#flex">Flex</a><a href="#agents">Agents</a></nav>
  <div class="controls">
    <button class="toggle" id="modeToggle">Dark</button>
    <button class="toggle" id="bgToggle">Particles</button>
  </div>
</header>

<main>
  <section id="overview" class="panel hero">
    <div class="hero-left">
      <h1><span id="riotId"></span></h1>
      <p class="subtitle">
        <span id="title"></span>
        <span class="rank-badge"><img src="./assets/rank-silver.svg" alt="Rank"/><span id="rank"></span></span>
      </p>
      <div class="stats">
        <div class="stat"><span class="label">Level</span><span id="lvl" class="value"></span></div>
        <div class="stat"><span class="label">VP</span><span id="vp" class="value"></span></div>
        <div class="stat"><span class="label">Radianite</span><span id="rad" class="value"></span></div>
        <div class="stat"><span class="label">KC</span><span id="kc" class="value"></span></div>
      </div>
    </div>
    <div class="hero-right">
      <div class="card-frame">
        <img id="playerCard" alt="Player Card" src="./assets/player-card.jpg" />
        <div class="card-caption"><span id="playerCardName"></span></div>
      </div>
    </div>
  </section>

  <section id="skins" class="panel">
    <h2>Locker</h2>
    <div id="groupGrid" class="group-grid"></div>
  </section>

  <section id="flex" class="panel">
    <h2>Flex</h2>
    <div id="flexGrid" class="flex-grid"></div>
  </section>

  <section id="agents" class="panel">
    <h2>Agents</h2>
    <h3>Unlocked</h3>
    <div id="agentsUnlocked" class="agents-grid"></div>
    <h3>Locked</h3>
    <div id="agentsLocked" class="agents-grid"></div>
  </section>
</main>

<footer class="site-footer"><span>Made with &lt;3 by jds • Valorant Locker</span></footer>

<script>
const DATA = {"player": {"riot_id": "jds#1337", "title": "β", "player_card_name": "VCT25 X 100T Card", "rank_peak": "Silver 1", "account": {"level": 31, "vp": 1612, "radianite": 20, "kc": 2669}, "flex": ["Champions 2025 Trophy", "SharkX", ":D", "Stat-Com"]}, "skins": {"Melee": ["Xenohunter", "5 Years // Beta Remastered Knife", "Atlas // CMD Baton (BP)", "Celestial Fan", "Champions 2025 Butterfly Knife", "Equilibrium", "Onimaru Kunitsuna", "RGX 11Z Pro Karambit", "Smite Knife", "SplashX Gloves"], "Classic": ["Spectrum Classic", "Atlas // CMD Classic (BP)", "Prime Classic", "VCT25 X 100T Classic"], "Shorty": ["Perch Shorty (BP)"], "Frenzy": ["Glitchpop Frenzy", "Haloform Frenzy (BP)"], "Ghost": ["Evori Dreamwings Ghost", "Belaflaire Ghost (BP)", "Sovereign Ghost", "Xerofang Ghost"], "Sheriff": ["Reaver Sheriff", "Space Piercer Sheriff (BP)"], "Stinger": ["X"], "Spectre": ["Evori Dreamwings Spectre", "Atlas // CMD Spectre (BP)", "Belaflaire Spectre (BP)"], "Bucky": ["Prime Bucky", "Belaflaire Bucky (BP)"], "Judge": ["Smite Judge", "Interhelm Judge (BP)", "Space Piercer Judge (BP)"], "Bulldog": ["Perch Bulldog (BP)"], "Guardian": ["Spectrum Guardian", "Space Piercer Guardian (BP)"], "Phantom": ["Oni Phantom", "Interhelm Phantom (BP)", "Perch Phantom (BP)", "Recon Phantom", "Ruination Phantom"], "Vandal": ["Champions 2025 Vandal", "Atlas // CMD Vandal (BP)", "Cryostasis Vandal", "Ion Vandal", "Prime Vandal", "Smite Vandal", "SplashX Vandal"], "Marshall": ["Perch Marshall (BP)"], "Outlaw": ["Smite Outlaw", "Atlas // CMD Outlaw (BP)"], "Operator": ["Ion Operator", "SplashX Operator", "Valiant Hero Operator"], "Ares": ["Space Piercer Ares (BP)", "Haloform Ares (BP)"], "Odin": ["Prime//2.0 Odin"]}, "flex_images": {"Champions 2025 Trophy": "assets/flex/Champions_2025_Trophy.jpg", "SharkX": "assets/flex/SharkX.jpg", ":D": "assets/flex/_D.jpg", "Stat-Com": "assets/flex/Stat-Com.jpg"}, "agents": {"unlocked": ["Brimstone", "Chamber", "Clove", "Fade", "Iso", "Jett", "Neon", "Phoenix", "Raze", "Reyna", "Sage", "Skye", "Sova", "Waylay", "Yoru"], "locked": ["Astra", "Breach", "Cypher", "Deadlock", "Gekko", "Harbor", "Kay/O", "Killjoy", "Omen", "Tejo", "Viper", "Vyse"]}};

// Toggles
const state = { dark: JSON.parse(localStorage.getItem('dark') ?? 'true'), particles: JSON.parse(localStorage.getItem('particles') ?? 'false') };
function applyState(){
  document.documentElement.style.setProperty('--particlesOpacity', state.particles ? 1 : 0);
  document.documentElement.style.setProperty('--shardOpacity', state.particles ? 0.3 : 1);
  modeToggle.textContent = state.dark ? 'Dark' : 'Light';
  modeToggle.classList.toggle('active', state.dark);
  bgToggle.textContent = state.particles ? 'Shards' : 'Particles';
  bgToggle.classList.toggle('active', state.particles);
  document.body.style.background = state.dark ? 'var(--v-dark)' : '#f7f8fa';
  document.body.style.color = state.dark ? 'var(--v-text)' : '#0b0e10';
}
modeToggle.onclick = ()=>{ state.dark=!state.dark; localStorage.setItem('dark', JSON.stringify(state.dark)); applyState(); };
bgToggle.onclick = ()=>{ state.particles=!state.particles; localStorage.setItem('particles', JSON.stringify(state.particles)); applyState(); };

// Particles
(function particles(){
  const canvas = document.getElementById('bg-particles'); const ctx = canvas.getContext('2d');
  let w,h; function resize(){w=canvas.width=innerWidth; h=canvas.height=innerHeight;} resize(); addEventListener('resize', resize);
  const P = 80; const pts = Array.from({length:P}, ()=>({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6, r:1.2+Math.random()*2}));
  function step(){ ctx.clearRect(0,0,w,h);
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1; }
    for(let i=0;i<P;i++){ for(let j=i+1;j<P;j++){ const a=pts[i], b=pts[j]; const dx=a.x-b.x, dy=a.y-b.y; const d=Math.hypot(dx,dy); if(d<140){ ctx.globalAlpha=1-d/140; ctx.strokeStyle='#ff4655'; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } } }
    ctx.globalAlpha=1; for(const p of pts){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); }
    requestAnimationFrame(step); }
  step();
})();

function thumbPath(weapon, name){
  const key = `${weapon}__${name}`.replaceAll('/','_').replaceAll(' ','_').replaceAll('(','').replaceAll(')','').replaceAll('.','').replaceAll('//','_').slice(0,70)+'.jpg';
  return 'assets/skins/'+key;
}

function render(){
  const d = DATA;
  riotId.textContent = d.player.riot_id;
  title.textContent = d.player.title;
  rank.textContent = d.player.rank_peak;
  lvl.textContent = d.player.account.level;
  vp.textContent = d.player.account.vp;
  rad.textContent = d.player.account.radianite;
  kc.textContent = d.player.account.kc;
  playerCardName.textContent = d.player.player_card_name;

  // Grouped skins
  const groupGrid = document.getElementById('groupGrid');
  Object.entries(d.skins||{}).forEach(([weapon, list])=>{
    const card = document.createElement('article'); card.className='group-card';
    card.innerHTML = `<div class="group-head"><h3>${weapon}</h3><span class="group-count">${list.length} item${list.length!==1?'s':''}</span></div>`;
    const ul = document.createElement('ul'); ul.className='skin-list';
    list.forEach(name=>{
      const isBP = /(\(BP\))/i.test(name);
      const display = name.replace(/\s*\(BP\)\s*/i, '');
      const li = document.createElement('li'); li.className='skin-item';
      li.innerHTML = `<img class="skin-thumb" src="${thumbPath(weapon,name)}" alt="">
        <div class="text">
          <div class="title" style="font-weight:700">${display}</div>
          ${isBP ? `<span class="bp-badge"><span class="bp-dot"></span>Battlepass Acquired</span>` : ''}
        </div>`;
      ul.appendChild(li);
    });
    card.appendChild(ul);
    groupGrid.appendChild(card);
  });

  // Flex

  // Flex
  const flexGrid = document.getElementById('flexGrid');
  (d.player.flex||[]).forEach(name=>{
    const imgPath = (d.flex_images||{})[name] || '';
    const el = document.createElement('article'); el.className='card';
    el.innerHTML = `<img src="${imgPath}" alt=""><div class="body"><h4>Flex</h4><span class="badge">${name}</span></div>`;
    flexGrid.appendChild(el);
  });

  // Agents
  function agentPath(n){ return 'assets/agents/'+n.replace(/[^A-Za-z0-9]+/g,'_')+'.jpg'; }
  const aU = document.getElementById('agentsUnlocked');
  const aL = document.getElementById('agentsLocked');
  (d.agents.unlocked||[]).forEach(n=>{ const el=document.createElement('article'); el.className='card'; el.innerHTML = `<img src="${agentPath(n)}" alt=""><div class="body"><h4>${n}</h4><span class="badge">Unlocked</span></div>`; aU.appendChild(el); });
  (d.agents.locked||[]).forEach(n=>{ const el=document.createElement('article'); el.className='card'; el.innerHTML = `<img src="${agentPath(n)}" alt=""><div class="body"><h4>${n}</h4><span class="badge">Locked</span></div>`; aL.appendChild(el); });

  applyState();
}
render();
</script>
</body>
</html>
